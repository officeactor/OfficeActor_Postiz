---
name: "OfficeActor Image"

# Builds the image OfficeActor deploys on Render (OFFICEACTOR-CHANGES.md ->
# Deployment on Render). Render does not redeploy on its own when the tag moves.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: officeactor-image
  cancel-in-progress: true

jobs:
  build-image:
    if: github.repository == 'officeactor/OfficeActor_Postiz'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          IMAGE: ghcr.io/officeactor/officeactor_postiz
        run: |
          # Render only runs linux/amd64 images.
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ${{ env.IMAGE }}:main \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            --pull \
            --provenance=false --sbom=false \
            --push .
